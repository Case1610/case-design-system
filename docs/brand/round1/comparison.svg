78"/></g></g></defs><text x="48" y="56" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="32" font-weight="600" fill="#17191e">Case / Identity studies</text><text x="48" y="92" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="19" font-weight="400" fill="#63666c">One identity, from wordmark to favicon.</text><text x="48" y="126" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="12" font-weight="600" fill="#71747a">01 — THREE DIRECTIONS  /  MONOCHROME  /  DRAFT</text><g transform="translate(0 180)"><path d="M48 0H1152" stroke="#d9d9d6"/><text x="48" y="40" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" fill="#17191e">A</text><text x="89" y="40" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="600" fill="#17191e">Open fit</text><text x="48" y="76" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" fill="#63666c">OPEN / FIT</text><text x="48" y="116" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" fill="#17191e">A small element finds its place in C.</text><text x="48" y="143" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" fill="#63666c">An open structure, tailored to its context.</text><g color="#17191e" transform="translate(425 33) scale(1.35)"><use href="#wA"/></g><rect x="912" y="24" width="156" height="156" rx="32" fill="#17191e"/><g color="white" transform="translate(925 35) scale(1.14)"><use href="#mA"/></g><text x="429" y="224" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="11" font-weight="600" fill="#71747a">WORDMARK</text><text x="913" y="224" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="11" font-weight="600" fill="#71747a">MARK</text><g color="#17191e" transform="translate(48 215) scale(.14)"><use href="#mA"/></g><g color="#17191e" transform="translate(88 207) scale(.28)"><use href="#mA"/></g><g color="#17191e" transform="translate(142 199) scale(.42)"><use href="#mA"/></g><text x="48" y="270" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="12" font-weight="400" fill="#71747a">16 / 32 / 48 px</text></g><g transform="translate(0 490)"><path d="M48 0H1152" stroke="#d9d9d6"/><text x="48" y="40" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" fill="#17191e">B</text><text x="89" y="40" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="23" font-weight="600" fill="#17191e">Cut &amp; compose</text><text x="48" y="76" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="16" font-weight="400" fill="#63666c">DIVIDE / COMPOSE</text><text x="48" y="116" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" fill="#17191e">Shared cuts. Shared weight. One system.</text><text x="48" y="143" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="15" font-weight="400" fill="#63666c">A mark combining features of C and e.</text><g color="#17191e" transform="translate(425 33) scale(1.35)"><use href="#wB"/></g><rect x="912" y="24" width="156" height="156" rx="32" fill="#17191e"/><g color="white" transform="translate(925 35) scale(1.14)"><use href="#mB"/></g><text x="429" y="224" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="11" font-weight="600" fill="#71747a">WORDMARK</text><text x="913" y="224" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="11" font-weight="600" fill="#71747a">MARK</text><g color="#17191e" transform="translate(48 215) scale(.14)"><use href="#mB"/></g><g color="#17191e" transform="translate(88 207) scale(.28)"><use href="#mB"/></g><g color="#17191e" transform="translate(142 199) scale(.42)"><use href="#mB"/></g><text x="48" y="270" font-family="Arial, Noto Sans CJK JP, sans-serif" font-size="12" font-weight="400" fill="#71747a">16 / 32 / 48 px</text></g><g transform="translate(0 800)"><path d="M48 0H1152" stroke="#d9d9d6"/><text x="48" y="40" font-family="Arial, Noto S